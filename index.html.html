        .hero-section::after {
            content: '';

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4); /* 暗さの調整 */

            opacity: 0.2;
            z-index: 1; /* オーバーレイより上 */

                </svg>
            ),
            Copy: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                </svg>
            ),
            Check: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                    <path d="M20 6 9 17l-5-5"/>
                </svg>
            ),
            X: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                    <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                </svg>
            ),
            Clock: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
            ),
            CreditCard: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                    <rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>
                </svg>
            ),
            ArrowRight: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                    <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
                </svg>
            ),
        };

        const Icon = ({ name, className }) => {
            const Component = IconComponents[name];
            return Component ? <Component className={className} /> : null;
        };

        // --- Components ---

        const LanguageSwitcher = ({ currentLang, setLang }) => {
            const languages = [
                { code: 'ja', label: '日本語' },
                { code: 'en', label: 'English' },
                { code: 'zh', label: '简体中文' },
                { code: 'ko', label: '한국어' }
            ];

            return (
                <div className="flex gap-2 bg-white/90 backdrop-blur rounded-full p-1 shadow-lg border border-brand-gold/30">
                    {languages.map(lang => (
                        <button
                            key={lang.code}
                            onClick={() => setLang(lang.code)}
                            className={`px-3 py-1 rounded-full text-xs font-medium transition-all duration-300 ${
                                currentLang === lang.code 
                                ? 'bg-brand-red text-white shadow-md transform scale-105 border border-brand-red' 
                                : 'text-gray-600 hover:text-brand-red bg-white border border-transparent'
                            }`}
                        >
                            {lang.label}
                        </button>
                    ))}
                </div>
            );
        };

        const CopyButton = ({ text, label }) => {
            const [copied, setCopied] = useState(false);

            const handleCopy = () => {
                navigator.clipboard.writeText(text).then(() => {
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                }).catch(err => {
                    // Fallback
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                });
            };

            return (
                <button 
                    onClick={handleCopy}
                    className="flex items-center gap-1 text-xs font-bold text-brand-gold hover:text-brand-red transition-colors border border-brand-gold/30 px-2 py-1 rounded hover:bg-brand-gold/10"
                >
                    {copied ? <Icon name="Check" className="w-3 h-3" /> : <Icon name="Copy" className="w-3 h-3" />}
                    {copied ? "OK" : label}
                </button>
            );
        };

        const InquirySection = ({ service, lang }) => {
            const [selectedCourseId, setSelectedCourseId] = useState(service.courses[0].id);
            
            const t = TRANSLATIONS[lang];
            const currentCourse = service.courses.find(c => c.id === selectedCourseId);
            const subjectText = `${service.serviceName[lang]} ${currentCourse.name[lang]}`;
            
            // 多言語テンプレートの適用
            const bodyTemplate = t.inquiryTemplate.replace('{{courseName}}', currentCourse.name[lang]);

            return (
                <div className="bg-brand-cream/50 border border-brand-gold/30 rounded-xl p-6 mt-8">
                    <h3 className="text-xl font-serif font-bold text-brand-red mb-4 flex items-center gap-2">
                        <Icon name="Mail" className="w-5 h-5" />
                        {t.inquiry}
                    </h3>
                    
                    <p className="text-sm text-gray-600 mb-6">{t.copyInstruction}</p>

                    <div className="mb-6">
                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">
                            {t.selectCourse}
                        </label>
                        <div className="flex flex-wrap gap-2">
                            {service.courses.map(course => (
                                <button
                                    key={course.id}
                                    onClick={() => setSelectedCourseId(course.id)}
                                    className={`px-4 py-2 rounded-lg text-sm transition-all ${
                                        selectedCourseId === course.id
                                        ? 'bg-brand-red text-white shadow-md'
                                        : 'bg-white text-gray-600 border border-gray-200 hover:border-brand-red'
                                    }`}
                                >
                                    {course.name[lang]}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="space-y-4">
                        <div className="group relative bg-white p-4 rounded-lg border border-gray-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex justify-between items-center mb-1">
                                <span className="text-xs font-bold text-gray-400 uppercase">{t.email}</span>
                                <CopyButton text={service.email} label={t.copy} />
                            </div>
                            <div className="font-mono text-gray-800 break-all select-all">{service.email}</div>
                        </div>

                        <div className="group relative bg-white p-4 rounded-lg border border-gray-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex justify-between items-center mb-1">
                                <span className="text-xs font-bold text-gray-400 uppercase">{t.subject}</span>
                                <CopyButton text={subjectText} label={t.copy} />
                            </div>
                            <div className="font-medium text-gray-800 select-all">{subjectText}</div>
                        </div>

                        <div className="group relative bg-white p-4 rounded-lg border border-gray-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex justify-between items-center mb-1">
                                <span className="text-xs font-bold text-gray-400 uppercase">{t.body}</span>
                                <CopyButton text={bodyTemplate} label={t.copy} />
                            </div>
                            <textarea 
                                readOnly
                                className="w-full h-48 bg-gray-50 border-none resize-none text-sm font-mono text-gray-600 focus:ring-0 p-0"
                                value={bodyTemplate}
                            />
                        </div>
                    </div>
                </div>
            );
        };

        const ServiceModal = ({ service, lang, onClose }) => {
            if (!service) return null;
            const t = TRANSLATIONS[lang];

            useEffect(() => {
                const handleEsc = (e) => {
                    if (e.key === 'Escape') onClose();
                };
                window.addEventListener('keydown', handleEsc);
                return () => window.removeEventListener('keydown', handleEsc);
            }, [onClose]);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
                    <div 
                        className="absolute inset-0 bg-brand-dark/80 backdrop-blur-sm transition-opacity"
                        onClick={onClose}
                    ></div>
                    <div className="relative w-full max-w-4xl max-h-[90vh] bg-white rounded-2xl shadow-2xl overflow-y-auto animate-slide-up flex flex-col">
                        
                        {/* Header Image */}
                        <div className="relative h-48 sm:h-64 flex-shrink-0">
                            <img 
                                src={service.image} 
                                alt={service.serviceName[lang]} 
                                className="w-full h-full object-cover"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-brand-red/80 to-transparent mix-blend-multiply"></div>
                            <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                            <button 
                                onClick={onClose}
                                className="absolute top-4 right-4 bg-white/20 hover:bg-white/40 backdrop-blur text-white rounded-full p-2 transition-colors z-10"
                            >
                                <Icon name="X" className="w-6 h-6" />
                            </button>
                            <div className="absolute bottom-6 left-6 right-6 z-10">
                                <span className="inline-block px-3 py-1 bg-brand-gold text-white text-xs font-bold rounded mb-2 tracking-wider shadow-sm">
                                    {service.companyName[lang]}
                                </span>
                                <h2 className="text-2xl sm:text-3xl font-serif font-bold text-white leading-tight drop-shadow-md">
                                    {service.serviceName[lang]}
                                </h2>
                            </div>
                        </div>

                        {/* Content */}
                        <div className="p-6 sm:p-10 space-y-10">
                            
                            {/* Appeal */}
                            <section>
                                <p className="text-gray-700 leading-relaxed text-lg border-l-4 border-brand-red pl-4">
                                    {service.appeal[lang]}
                                </p>
                            </section>

                            <hr className="border-brand-gold/20" />

                            {/* Courses List */}
                            <section>
                                <h3 className="text-xl font-serif font-bold text-brand-red mb-6 flex items-center gap-2">
                                    <span className="w-8 h-[1px] bg-brand-red"></span>
                                    {t.courses}
                                </h3>
                                <div className="grid gap-6">
                                    {service.courses.map(course => (
                                        <div key={course.id} className="bg-brand-cream/30 rounded-xl p-6 border border-brand-gold/20 shadow-sm hover:shadow-md transition-shadow">
                                            <div className="flex flex-col sm:flex-row sm:items-baseline justify-between mb-2">
                                                <h4 className="text-lg font-bold text-brand-dark">{course.name[lang]}</h4>
                                                <span className="text-xl font-serif font-bold text-brand-red mt-2 sm:mt-0">
                                                    {course.price.toLocaleString()}{t.yen} / {t.person}
                                                </span>
                                            </div>
                                            <p className="text-gray-600 mb-4 text-sm">{course.desc[lang]}</p>
                                            
                                            <div className="grid grid-cols-2 gap-4 text-sm mb-4">
                                                <div className="flex items-center gap-2 text-gray-500">
                                                    <Icon name="Clock" className="w-4 h-4 text-brand-gold" />
                                                    {t.requiredTime}: {course.time[lang]}
                                                </div>
                                                <div className="flex items-center gap-2 text-gray-500">
                                                    <Icon name="CreditCard" className="w-4 h-4 text-brand-gold" />
                                                    {course.payment[lang]}
                                                </div>
                                            </div>
                                            
                                            <div className="mt-4 bg-white p-4 rounded-lg text-xs sm:text-sm text-gray-600 leading-6 border border-gray-100">
                                                <strong className="block text-brand-gold mb-2">{t.flow}</strong>
                                                <ul className="list-none space-y-1">
                                                    {course.flow[lang].map((step, i) => (
                                                        <li key={i}>{step}</li>
                                                    ))}
                                                </ul>
                                            </div>
                                            <div className="mt-3 text-xs text-brand-red text-right font-medium">
                                                {t.notes}: {course.notes[lang]}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>

                            <hr className="border-brand-gold/20" />

                            {/* Inquiry Form */}
                            <InquirySection service={service} lang={lang} />

                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('ja');
            const [selectedService, setSelectedService] = useState(null);
            
            const t = TRANSLATIONS[lang];

            return (
                <div className="min-h-screen relative overflow-hidden flex flex-col">
                    {/* Navigation */}
                    <nav className="relative z-20 flex justify-between items-center px-6 py-6 max-w-7xl mx-auto w-full">
                        <div className="flex items-center gap-3">
                            <img src="https://i.imgur.com/wXrm9Fw.png" alt="Yuinoya Logo" className="h-10 w-auto" />
                            <span className="text-xl font-serif font-bold tracking-widest text-brand-dark hidden sm:block">YUINOYA</span>
                        </div>
                        <LanguageSwitcher currentLang={lang} setLang={setLang} />
                    </nav>

                    {/* Hero Section */}
                    <header className="relative z-10 hero-section text-white rounded-b-[3rem] sm:rounded-b-[4rem] shadow-2xl mb-16 mx-0 sm:mx-4">
                        <div className="hero-pattern"></div>
                        <div className="relative z-20 px-6 pt-24 pb-36 max-w-5xl mx-auto text-center">
                            
                            {/* Decorative Frame */}
                            <div className="inline-block px-8 py-2 border border-[#FFD700]/60 rounded-full text-[#FFD700] text-xs font-bold tracking-[0.3em] mb-8 uppercase bg-black/30 backdrop-blur-sm animate-fade-in shadow-lg">
                                Japan Premium Experience
                            </div>

                            <h1 className="text-3xl sm:text-5xl md:text-6xl font-serif font-bold mb-8 leading-tight animate-fade-in text-shadow-hero tracking-wide">
                                <span className="whitespace-pre-wrap">{t.mainCopy}</span>
                            </h1>
                            
                            <p className="text-white/95 max-w-2xl mx-auto leading-relaxed text-base sm:text-lg mb-4 animate-slide-up whitespace-pre-wrap font-medium text-shadow-hero">
                                {t.subCopy}
                            </p>
                        </div>
                        
                        {/* Decorative Gold Line */}
                        <div className="absolute bottom-10 left-1/2 transform -translate-x-1/2 w-24 h-1 bg-gradient-to-r from-transparent via-brand-brightGold to-transparent rounded-full z-20"></div>
                    </header>

                    {/* Service Grid */}
                    <main className="relative z-10 px-6 pb-24 max-w-7xl mx-auto w-full flex-grow">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {SERVICES_DATA.map((service) => (
                                <div 
                                    key={service.id}
                                    onClick={() => setSelectedService(service)}
                                    className="group relative h-[450px] rounded-2xl overflow-hidden cursor-pointer shadow-lg transition-all duration-500 hover:-translate-y-2 hover:shadow-2xl border border-brand-gold/10 bg-brand-white"
                                >
                                    {/* Image */}
                                    <div className="absolute inset-0 h-[65%] overflow-hidden">
                                        <img 
                                            src={service.image} 
                                            alt={service.serviceName[lang]} 
                                            className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                                        />
                                        <div className="absolute inset-0 bg-gradient-to-t from-brand-dark/80 to-transparent opacity-60"></div>
                                    </div>
                                    
                                    {/* Content Card */}
                                    <div className="absolute bottom-0 left-0 right-0 h-[35%] bg-white p-6 flex flex-col justify-between">
                                        <div>
                                            <div className="text-brand-red text-xs font-bold tracking-widest uppercase mb-2">
                                                {service.label[lang]}
                                            </div>
                                            <h3 className="text-lg font-serif font-bold text-brand-dark leading-snug line-clamp-2 group-hover:text-brand-red transition-colors">
                                                {service.serviceName[lang]}
                                            </h3>
                                        </div>
                                        <div className="flex justify-between items-end mt-2">
                                            <span className="text-xs text-gray-400 font-medium">{service.companyName[lang]}</span>
                                            <span className="inline-flex items-center gap-1 text-brand-gold text-xs font-bold border-b border-brand-gold/30 pb-0.5 group-hover:border-brand-gold transition-colors">
                                                {t.viewDetails} <Icon name="ArrowRight" className="w-3 h-3" />
                                            </span>
                                        </div>
                                    </div>

                                    {/* Floating Label overlay on image */}
                                    <div className="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1 rounded-md text-xs font-bold text-brand-dark shadow-sm">
                                        RECOMMENDED
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="relative z-10 text-center py-10 text-xs text-gray-500 border-t border-brand-gold/20 bg-brand-cream">
                        <div className="mb-4">
                             <span className="text-lg font-serif font-bold text-brand-red tracking-widest">YUINOYA</span>
                        </div>
                        &copy; 2026 YUINOYA Brand by Ritz. All rights reserved.
                    </footer>

                    {/* Detail Modal */}
                    {selectedService && (
                        <ServiceModal 
                            service={selectedService} 
                            lang={lang} 
                            onClose={() => setSelectedService(null)} 
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
